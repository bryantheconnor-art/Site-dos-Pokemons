<!DOCTYPE html> <!-- Informa ao navegador que este documento usa HTML5. -->
<html lang="pt-br"> <!-- Define o idioma principal da página como português do Brasil. -->
<head>
    <meta charset="UTF-8"> <!-- Permite exibir corretamente acentos e outros caracteres. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta a largura da página para dispositivos móveis. -->
    <link rel="stylesheet" href="style.css"> <!-- Carrega os estilos definidos no arquivo CSS. -->
    <script src="./app.js" defer></script> <!-- Carrega o JavaScript após o HTML ser interpretado. -->
    <title>Meu site protótipo</title> <!-- Define o título mostrado na aba do navegador. -->
</head>
<body>
    <nav> <!-- Cria a área de navegação do site. -->
    <ul>
        <li><a href="#home">Home</a></li> <!-- Mostra a página inicial sem carregar outro arquivo HTML. -->
        <li><a href="#about">About</a></li> <!-- Mostra a página sobre criada pelo JavaScript. -->
        <li><a href="#contato">Contato</a></li> <!-- Mostra os contatos da FATEC criados pelo JavaScript. -->
        <li><a href="#cursos">Cursos</a></li> <!-- Mostra os cursos criados pelo JavaScript. -->
    </ul>
</nav>
<main id="root"></main> <!-- Área principal preenchida pelo JavaScript. -->
</body>
</html>
